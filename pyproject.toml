[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cashlyctl"
version = "0.1.0"
description = "Terminal operations console and CLI for Cashly/DealSense deployments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.63.0",
  "typer>=0.12.3",
  "pyfiglet>=1.0.2",
  "boto3>=1.34.0",
]

[project.scripts]
cashlyctl = "cashlyctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

